<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>From Big Bang to Solar System</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;700&family=Roboto:wght@400;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/style.css" />

  <!-- Import map: lets every module do `import * as THREE from 'three'` -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="viewport">
    <canvas id="scene-canvas" aria-hidden="true"></canvas>

    <!-- HUD overlay: purely presentational, driven entirely by UIManager -->
    <div id="hud" role="region" aria-label="Simulation controls and readout">

      <div id="hud-top">
        <!-- App branding: purely decorative, static (no UIManager wiring) -->
        <div id="hud-brand" aria-hidden="true">
          <div id="hud-brand-icon">
            <svg viewBox="0 0 24 24" width="100%" height="100%">
              <circle cx="12" cy="12" r="11" class="hud-brand-icon-ring" />
              <path
                class="hud-brand-icon-arm"
                d="M12.7,11.74 L12.8,11.9 L12.87,12.09 L12.89,12.31 L12.87,12.54 L12.78,12.78 L12.63,13.01 L12.42,13.21 L12.15,13.38 L11.83,13.49 L11.46,13.52 L11.06,13.47 L10.65,13.32 L10.26,13.06 L9.91,12.7 L9.63,12.23 L9.45,11.67 L9.4,11.03 L9.5,10.35 L9.77,9.66"
              />
              <path
                class="hud-brand-icon-arm"
                d="M11.3,12.26 L11.2,12.1 L11.13,11.91 L11.11,11.69 L11.13,11.46 L11.22,11.22 L11.37,10.99 L11.58,10.79 L11.85,10.62 L12.17,10.51 L12.54,10.48 L12.94,10.53 L13.35,10.68 L13.74,10.94 L14.09,11.3 L14.37,11.77 L14.55,12.33 L14.6,12.97 L14.5,13.65 L14.23,14.34"
              />
              <circle cx="12" cy="12" r="1" class="hud-brand-icon-core" />
            </svg>
          </div>
          <div id="hud-brand-text">
            <div id="hud-brand-title">GALACTIC ODYSSEY</div>
            <div id="hud-brand-subtitle">From the Big Bang to the Solar System</div>
          </div>
        </div>

        <header id="hud-header">
          <div id="hud-epoch-block">
            <button
              id="hud-epoch-toggle"
              class="hud-card-toggle"
              type="button"
              aria-expanded="true"
              aria-controls="hud-epoch-summary"
              aria-label="Collapse epoch description"
            ><span class="hud-toggle-chevron" aria-hidden="true">&#9662;</span></button>
            <span id="hud-epoch-index" class="hud-mono">01 / 13</span>
            <h1 id="hud-epoch-name">Early Hot, Dense Universe</h1>
            <p id="hud-epoch-summary"></p>
          </div>

          <div id="hud-readouts-card">
            <button
              id="hud-readouts-toggle"
              class="hud-card-toggle"
              type="button"
              aria-expanded="true"
              aria-label="Collapse readout values"
            ><span class="hud-toggle-chevron" aria-hidden="true">&#9662;</span></button>
            <dl id="hud-readouts" class="hud-mono">
              <div class="hud-readout">
                <dt>Cosmic time</dt>
                <dd id="hud-cosmic-time">0 s</dd>
              </div>
              <div class="hud-readout">
                <dt id="hud-temperature-label">Cosmic background temperature</dt>
                <dd id="hud-temperature">0 K</dd>
              </div>
            </dl>
          </div>
        </header>
      </div>

      <footer id="hud-footer">
        <div id="hud-form-planets-wrap">
          <div id="hud-form-planets-group">
            <button id="hud-form-planets" class="hud-icon-button is-hidden" type="button">Form Planets</button>
            <button id="hud-scale-info-button" class="is-hidden" type="button" aria-label="Scale information" aria-expanded="false">i</button>
            <div id="hud-scale-note" class="is-hidden" role="tooltip">Not to scale — sizes and distances are illustrative</div>
          </div>
        </div>

        <div id="hud-transport-center">
          <div id="hud-transport">
            <div id="hud-transport-nav">
              <button id="hud-prev-epoch" class="hud-icon-button hud-nav-button" aria-label="Previous epoch">&#8249;</button>
              <button id="hud-play-toggle" class="hud-icon-button hud-play-toggle" aria-label="Play">&#9654;</button>
              <button id="hud-next-epoch" class="hud-icon-button hud-nav-button" aria-label="Next epoch">&#8250;</button>
            </div>

            <div id="hud-speed-pill">
              <select id="hud-speed-select" aria-label="Playback speed">
                <option value="0.25">0.25&times;</option>
                <option value="0.5" selected>0.5&times;</option>
                <option value="1">1&times;</option>
                <option value="2">2&times;</option>
                <option value="4">4&times;</option>
              </select>
            </div>
          </div>
        </div>

        <div id="hud-timeline-wrap">
          <div id="hud-timeline-track">
            <div id="hud-timeline-fill"></div>
            <div id="hud-timeline"></div>
          </div>
        </div>
      </footer>

      <div id="hud-planet-label" class="is-hidden" aria-live="polite">
        <span id="hud-planet-label-name"></span>
      </div>

      <div id="hud-galaxy-panel" class="is-hidden" aria-live="polite">
        <h2 id="hud-galaxy-title">Galaxy</h2>
        <dl id="hud-galaxy-facts" class="hud-mono">
          <div class="hud-galaxy-fact">
            <dt>Type</dt>
            <dd id="hud-galaxy-type">—</dd>
          </div>
          <div class="hud-galaxy-fact">
            <dt>Relative size</dt>
            <dd id="hud-galaxy-size">—</dd>
          </div>
          <div class="hud-galaxy-fact">
            <dt>Approximate stellar population</dt>
            <dd id="hud-galaxy-population">—</dd>
          </div>
          <div class="hud-galaxy-fact">
            <dt>Formation stage</dt>
            <dd id="hud-galaxy-stage">—</dd>
          </div>
        </dl>
        <div id="hud-galaxy-actions">
          <button id="hud-galaxy-enter" class="hud-icon-button" type="button">Explore Galaxy</button>
          <button id="hud-galaxy-return" class="hud-icon-button is-hidden" type="button">Return to Galaxy Field</button>
          <button id="hud-galaxy-continue" class="hud-icon-button is-hidden" type="button">Continue to Milky Way &rarr;</button>
        </div>
      </div>

    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
